name: Renovate

on:
  schedule:
    - cron: "47 * * * *"

  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write # Renovate commits dependency updates.
      pull-requests: write # Renovate creates and updates pull requests.
      issues: write # Renovate may create or update dependency issues.

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        env:
          RENOVATE_GIT_AUTHOR: Gavini Sumanth <100990200+GaviniSumanth@users.noreply.github.com>
          LOG_LEVEL: info
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_DETECT_HOST_RULES_FROM_ENV: true
          RENOVATE_DOCKER_DHI_IO_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          RENOVATE_DOCKER_DHI_IO_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
          additional-env-list: |
            RENOVATE_DOCKER_DHI_IO_USERNAME
            RENOVATE_DOCKER_DHI_IO_PASSWORD
