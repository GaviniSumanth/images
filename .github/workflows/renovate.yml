name: Renovate

on:
  schedule:
    - cron: "47 * * * *"

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.11
        env:
          RENOVATE_GIT_AUTHOR: 100990200+GaviniSumanth@users.noreply.github.com
          LOG_LEVEL: debug
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_DOCKER_DHI_IO_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          RENOVATE_DOCKER_DHI_IO_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          configurationFile: renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
          additional-env-list: |
            RENOVATE_DOCKER_DHI_IO_USERNAME
            RENOVATE_DOCKER_DHI_IO_PASSWORD
