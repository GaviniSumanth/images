name: Build Containers

on:
  push:
    branches:
      - main
    paths:
      - releases.json
      - "**/Containerfile"
      - "**/tests/**"
      - .github/workflows/build-container.yml
      - .github/workflows/container-pipeline.yml
      - .github/scripts/**

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect changed releases
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      owner: ${{ steps.meta.outputs.owner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Normalize registry owner
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Validate release configuration
        run: bash .github/scripts/validate-releases.sh

      - name: Detect changed releases
        id: changes
        run: |
          matrix_output=$(bash .github/scripts/detect-changes.sh "${{ github.event.before }}" "${{ github.sha }}")
          echo "$matrix_output" >> "$GITHUB_OUTPUT"
          echo "Build matrix: $(echo "$matrix_output" | cut -d'=' -f2-)"

  dispatch:
    name: Run Container Pipeline
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    uses: ./.github/workflows/container-pipeline.yml
    with:
      matrix: ${{ needs.detect.outputs.matrix }}
      owner: ${{ needs.detect.outputs.owner }}
    secrets: inherit