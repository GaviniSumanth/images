name: Build Containers

on:
  push:
    branches:
      - main
    paths:
      - releases.json
      - "images/**"
      - "**/Containerfile"
      - "**/Containerfile.dockerignore"
      - pyproject.toml
      - "tests/**"
      - .github/workflows/build-container.yml
      - .github/workflows/container-pipeline.yml
      - .github/scripts/**

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect changed releases
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      packages: read # Reconciliation checks whether published GHCR aliases exist.

    outputs:
      build_matrix: ${{ steps.reconcile.outputs.build_matrix }}
      verify_matrix: ${{ steps.reconcile.outputs.verify_matrix }}
      owner: ${{ steps.meta.outputs.owner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Normalize registry owner
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: python3 .github/scripts/normalize_owner.py

      - name: Validate release configuration
        run: python3 .github/scripts/validate_releases.py

      - name: Validate image configuration
        run: python3 .github/scripts/validate_images.py

      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check -r tests/requirements-test.txt

      - name: Run pipeline unit tests
        run: python3 -m pytest -m unit

      - name: Detect changed releases
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          CURRENT: ${{ github.sha }}
        run: python3 .github/scripts/detect_changes.py

      - name: Reconcile unpublished verify entries
        id: reconcile
        env:
          BUILD_MATRIX: ${{ steps.changes.outputs.build_matrix }}
          VERIFY_MATRIX: ${{ steps.changes.outputs.verify_matrix }}
          OWNER: ${{ steps.meta.outputs.owner }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/reconcile_verify.py

  dispatch:
    name: Run Container Pipeline
    needs: detect
    if: needs.detect.outputs.build_matrix != '[]' || needs.detect.outputs.verify_matrix != '[]'
    uses: ./.github/workflows/container-pipeline.yml
    with:
      build_matrix: ${{ needs.detect.outputs.build_matrix }}
      verify_matrix: ${{ needs.detect.outputs.verify_matrix }}
      owner: ${{ needs.detect.outputs.owner }}
    permissions:
      contents: read
      packages: write # The called workflow publishes tested images to GHCR.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
