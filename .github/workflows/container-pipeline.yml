name: Container Pipeline

on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
      owner:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build:
    name: Build ${{ matrix.release.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(inputs.matrix || '[]') }}

    steps:
      - name: Checkout build repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: build
          persist-credentials: false

      - name: Checkout upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ matrix.release.repo }}
          ref: ${{ matrix.release.tag }}
          path: source
          persist-credentials: false

      - name: Get upstream revision
        id: upstream
        working-directory: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set image names
        id: image
        run: build/.github/scripts/set-image-names.sh "${{ inputs.owner }}" "${{ matrix.release.image }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hardened Images
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push candidate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./source
          file: ./build/${{ matrix.release.containerfile }}
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.candidate }}
          labels: |
            org.opencontainers.image.title=${{ matrix.release.image }}
            org.opencontainers.image.source=https://github.com/${{ matrix.release.repo }}
            org.opencontainers.image.version=${{ matrix.release.tag }}
            org.opencontainers.image.revision=${{ steps.upstream.outputs.revision }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.release.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.release.image }}

      - name: Validate test configuration
        run: build/.github/scripts/validate-test-config.sh "${{ matrix.release.test_context }}"

  test:
    name: Test ${{ matrix.release.image }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      packages: read
      contents: read

    env:
      TEST_IMAGE: ghcr.io/${{ inputs.owner }}/${{ matrix.release.image }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}

    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(inputs.matrix || '[]') }}

    steps:
      - name: Checkout build repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: build
          persist-credentials: false

      - name: Verify Docker daemon
        run: docker info

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull candidate image
        run: docker pull "$TEST_IMAGE"

      - name: Execute image tests
        run: ./run-tests.sh
        working-directory: build/${{ matrix.release.test_context }}

  scan:
    name: Scan ${{ matrix.release.image }} (${{ matrix.platform }})
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(inputs.matrix || '[]') }}
        platform:
          - linux/amd64

    steps:
      - name: Checkout build repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: build
          persist-credentials: false

      - name: Set image names
        id: image
        run: build/.github/scripts/set-image-names.sh "${{ inputs.owner }}" "${{ matrix.release.image }}"

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.candidate }}
          format: table
          vuln-type: os
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: Publish ${{ matrix.release.image }}
    needs: [build, test, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(inputs.matrix || '[]') }}

    steps:
      - name: Checkout build repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: build
          persist-credentials: false

      - name: Set image names
        id: image
        run: build/.github/scripts/set-image-names.sh "${{ inputs.owner }}" "${{ matrix.release.image }}"

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Promote scanned image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          CANDIDATE: ${{ steps.image.outputs.candidate }}
          RELEASE: ${{ matrix.release.tag }}
        run: |
          docker buildx imagetools create --tag "${IMAGE}:${RELEASE}" "${IMAGE}:${CANDIDATE}"
          echo "Published ${IMAGE}:${RELEASE}"