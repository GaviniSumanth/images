name: Generate Changelogs

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate changelogs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      changed: ${{ steps.generate.outputs.changed }}

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install git-cliff
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: git-cliff@2.14.2

      - name: Generate changelogs
        id: generate
        run: python3 .github/scripts/generate_changelogs.py

      - name: Upload generated changelogs
        if: steps.generate.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-changelogs
          path: |
            CHANGELOG.md
            changelogs/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish changelogs
    needs: generate
    if: github.ref == 'refs/heads/main' && needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      actions: read
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download generated changelogs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-changelogs
          path: ${{ runner.temp }}/generated-changelogs

      - name: Publish changelogs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GENERATED_CHANGELOG_DIR: ${{ runner.temp }}/generated-changelogs
          CHANGELOG_BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/scripts/publish_changelogs.py
